<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôle Parental - Connexion Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        h2 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 28px;
        }

        p.subtitle {
            color: #e0e0e0;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            color: #ffffff;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 8px;
            color: #white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }

        input::placeholder {
            color: #dddddd;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #667eea;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #5a6fd6;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #error-message {
            color: #ff4d4d;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        #success-message {
            color: #2ecc71;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Parental Control</h2>
        <p class="subtitle">Connectez-vous pour synchroniser l'application</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Adresse Email Parents</label>
                <input type="email" id="email" placeholder="exemple@mail.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Se connecter</button>
        </form>

        <div id="error-message"></div>
        <div id="success-message">Connexion réussie ! Synchronisation en cours...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // CONFIGURATION CONFIG FIREBASE (Copiez-la depuis votre console Firebase)
        const firebaseConfig = {
            apiKey: "VOTRE_API_KEY",
            authDomain: "VOTRE_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://VOTRE_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "VOTRE_PROJECT_ID",
            storageBucket: "VOTRE_PROJECT_ID.appspot.com",
            messagingSenderId: "VOTRE_SENDER_ID",
            appId: "VOTRE_APP_ID"
        };

        // Initialisation de Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        // Gestion de la soumission du formulaire
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            // 1. Connexion de l'utilisateur sur le Web
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    successDiv.style.display = 'block';

                    // 2. INTERCONNEXION : On met à jour un statut dans la base de données
                    // L'application Android écoute ce nœud et réagira immédiatement
                    set(ref(database, 'users/' + user.uid), {
                        panelWebConnecte: true,
                        derniereConnexionWeb: new Date().toISOString()
                    });
                })
                .catch((error) => {
                    errorDiv.innerText = "Erreur : " + error.message;
                    errorDiv.style.display = 'block';
                });
        });
    </script>
</body>
</html>
